<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flow Pattern Canvas</title>
  <link rel="stylesheet" href="https://unpkg.com/@xyflow/react@12.11.0/dist/style.css" />
  <style>
    html,body,#root{width:100%;height:100%;margin:0}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc}
    *{box-sizing:border-box}
    .page{width:100%;height:100%;display:flex;flex-direction:column}
    .bar{height:52px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #e2e8f0;background:#fff}
    .bar strong{font-size:14px;color:#0f172a}
    .bar span{margin-left:10px;font-size:12px;color:#64748b}
    .canvas{flex:1;min-height:0;background:#fbfdff}
    .react-flow__node-input,
    .react-flow__node-output,
    .react-flow__node-default{
      background:#fff!important;
      color:#0f172a!important;
      border:1px solid #cbd5e1!important;
      border-radius:10px!important;
      font-size:13px!important;
      font-weight:600!important;
      box-shadow:0 2px 8px rgba(15,23,42,.06)!important;
      padding:10px 16px!important;
      min-width:150px;
    }
    .react-flow__handle{background:#334155!important;border:none!important;width:8px!important;height:8px!important}
    .react-flow__edge-path{stroke:#64748b;stroke-width:1.6}
    .react-flow__edge-text{font-size:11px;fill:#334155}
    .react-flow__edge-textbg{fill:#fff;fill-opacity:.95}
    .react-flow__controls{border-radius:10px!important;overflow:hidden;box-shadow:0 2px 10px rgba(15,23,42,.08)!important}
    .react-flow__controls button{background:#fff!important;border-bottom:1px solid #e2e8f0!important;color:#334155!important}
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.1.1",
      "react/jsx-runtime": "https://esm.sh/react@19.1.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@19.1.1",
      "react-dom/client": "https://esm.sh/react-dom@19.1.1/client"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import {
      ReactFlow,
      Background,
      Controls,
      MarkerType,
      BackgroundVariant
    } from "https://esm.sh/@xyflow/react@12.11.0?external=react,react-dom";

    const h = React.createElement;
    const baseEdgeStyle = { stroke: "#64748b", strokeWidth: 1.6 };

    const nodes = [
      { id: "q", position: { x: 260, y: 20 }, data: { label: "Is user logged in?" }, type: "input" },
      { id: "yes", position: { x: 80, y: 140 }, data: { label: "Show dashboard" } },
      { id: "no", position: { x: 440, y: 140 }, data: { label: "Redirect to login" } },
      { id: "a1", position: { x: 0, y: 260 }, data: { label: "Profile" }, type: "output" },
      { id: "a2", position: { x: 160, y: 260 }, data: { label: "Reports" }, type: "output" },
      { id: "b1", position: { x: 440, y: 260 }, data: { label: "Auth form" }, type: "output" }
    ];

    const edges = [
      { id: "1", source: "q", target: "yes", label: "yes", type: "smoothstep", style: baseEdgeStyle, markerEnd: { type: MarkerType.ArrowClosed } },
      { id: "2", source: "q", target: "no", label: "no", type: "smoothstep", style: baseEdgeStyle, markerEnd: { type: MarkerType.ArrowClosed } },
      { id: "3", source: "yes", target: "a1", type: "smoothstep", style: baseEdgeStyle },
      { id: "4", source: "yes", target: "a2", type: "smoothstep", style: baseEdgeStyle },
      { id: "5", source: "no", target: "b1", type: "smoothstep", style: baseEdgeStyle }
    ];

    function App(){
      return h("div",{className:"page"},
        h("div",{className:"bar"},
          h("strong",null,"FlowPattern — Decision Tree"),
          h("span",null,"Standalone React Flow canvas copied from the reference structure")
        ),
        h("div",{className:"canvas"},
          h(ReactFlow,{
            nodes,
            edges,
            fitView:true,
            fitViewOptions:{padding:0.2},
            nodesDraggable:true,
            nodesConnectable:false
          },
            h(Background,{variant:BackgroundVariant.Dots,gap:18,size:1}),
            h(Controls,{showInteractive:false})
          )
        )
      );
    }

    createRoot(document.getElementById("root")).render(h(App));
  </script>
</body>
</html>
