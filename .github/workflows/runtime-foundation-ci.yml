name: Phase 1-10 Runtime QA

on:
  push:
    branches:
      - phase10-runtime-conformance
  workflow_dispatch:

concurrency:
  group: phase-1-10-runtime-qa
  cancel-in-progress: true

jobs:
  runtime-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm install --prefix server --no-audit --no-fund

      - name: Run deep project module audit
        id: deep_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/deep-project-audit.mjs 2>&1 | tee deep-project-audit.log

      - name: Run complete server test suite
        id: server_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test server/test/*.test.mjs 2>&1 | tee server-tests.log

      - name: Run server trusted-runtime build checks
        id: server_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build --prefix server 2>&1 | tee server-build.log

      - name: Run frontend trusted-runtime build
        id: frontend_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend-build.log

      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-10-runtime-qa-logs
          path: |
            deep-project-audit.log
            artifacts/deep-project-audit.json
            server-tests.log
            server-build.log
            frontend-build.log
          if-no-files-found: warn

      - name: Fail if any QA stage failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.deep_audit.outcome }}" = "success"
          test "${{ steps.server_tests.outcome }}" = "success"
          test "${{ steps.server_build.outcome }}" = "success"
          test "${{ steps.frontend_build.outcome }}" = "success"
