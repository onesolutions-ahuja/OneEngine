name: Phase 1-10 Runtime QA

on:
  push:
    branches:
      - phase10-runtime-conformance
  workflow_dispatch:

jobs:
  runtime-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm install --prefix server --no-audit --no-fund

      - name: Run complete server test suite
        run: node --test server/test/*.test.mjs

      - name: Run server trusted-runtime build checks
        run: npm run build --prefix server

      - name: Run frontend trusted-runtime build
        run: npm run build
