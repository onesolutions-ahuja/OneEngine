name: Export UX Audit Source

on:
  push:
    branches: ["ux-audit"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack repository
        run: |
          tar --exclude=.git -czf /tmp/oneengine-ux-audit.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: oneengine-ux-audit-source
          path: /tmp/oneengine-ux-audit.tar.gz
          retention-days: 1
