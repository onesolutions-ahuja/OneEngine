name: OneEngine Playwright E2E

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "server/**"
      - "tests/e2e/**"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/playwright-e2e.yml"

concurrency:
  group: oneengine-playwright-e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ONEPOS_E2E_BASE_URL: https://onesolutions-ahuja.github.io/OneEngine/
      ONEPOS_E2E_API_BASE_URL: https://onepos.onrender.com/
      ONEPOS_E2E_USERNAME: ${{ vars.ONEPOS_PLAYWRIGHT_USERNAME }}
      ONEPOS_E2E_PASSWORD: ${{ vars.ONEPOS_PLAYWRIGHT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reinstall Playwright Chromium
        run: |
          rm -rf ~/.cache/ms-playwright
          npx playwright install --with-deps chromium

      - name: Wait for deployed frontend
        run: |
          for i in {1..18}; do
            if curl -fsSL "$ONEPOS_E2E_BASE_URL" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Verify E2E credentials
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$(jq -n --arg username "$ONEPOS_E2E_USERNAME" --arg password "$ONEPOS_E2E_PASSWORD" '{username:$username,password:$password,actingCompanyId:null}')"
          LOGIN_URL="${ONEPOS_E2E_API_BASE_URL%/}/api/auth/login"
          for attempt in {1..12}; do
            STATUS="$(curl -sS -o /tmp/onepos-e2e-login.json -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -d "$PAYLOAD" \
              "$LOGIN_URL" || true)"
            SUCCESS="$(jq -r '.success // false' /tmp/onepos-e2e-login.json 2>/dev/null || echo false)"
            if [ "$STATUS" = "200" ] && [ "$SUCCESS" = "true" ]; then
              echo "E2E credential check passed against API deployment."
              exit 0
            fi
            MESSAGE="$(jq -r '.message // "authentication rejected"' /tmp/onepos-e2e-login.json 2>/dev/null || echo 'authentication rejected')"
            if [ "$STATUS" = "503" ] || [ "$STATUS" = "502" ] || [ "$STATUS" = "504" ]; then
              echo "API not ready yet (HTTP $STATUS: $MESSAGE), retrying..."
              sleep 10
              continue
            fi
            echo "::error::E2E login failed against API deployment (HTTP $STATUS): $MESSAGE"
            exit 1
          done
          MESSAGE="$(jq -r '.message // "API did not become ready"' /tmp/onepos-e2e-login.json 2>/dev/null || echo 'API did not become ready')"
          echo "::error::E2E API remained unavailable after warm-up retries: $MESSAGE"
          exit 1

      - name: Run Playwright QA
        run: npx playwright test --project=desktop-chromium

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
