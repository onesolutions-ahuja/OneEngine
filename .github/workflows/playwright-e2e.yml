name: OneEngine Playwright E2E

on:
  workflow_dispatch:

concurrency:
  group: oneengine-live-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ONEPOS_E2E_BASE_URL: https://onesolutions-ahuja.github.io/OneEngine/
      ONEPOS_E2E_API_BASE_URL: https://oneengine-6gas.onrender.com/
      ONEPOS_E2E_USERNAME: ${{ vars.ONEPOS_PLAYWRIGHT_USERNAME }}
      ONEPOS_E2E_PASSWORD: ${{ vars.ONEPOS_PLAYWRIGHT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reinstall Playwright Chromium
        run: |
          rm -rf ~/.cache/ms-playwright
          npx playwright install --with-deps chromium

      - name: Wait for deployed frontend
        run: |
          for i in {1..18}; do
            if curl -fsSL "$ONEPOS_E2E_BASE_URL" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Verify E2E configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ONEPOS_E2E_USERNAME" || { echo "::error::ONEPOS_PLAYWRIGHT_USERNAME is missing."; exit 1; }
          test -n "$ONEPOS_E2E_PASSWORD" || { echo "::error::ONEPOS_PLAYWRIGHT_PASSWORD is missing."; exit 1; }
          curl -fsSL "${ONEPOS_E2E_API_BASE_URL%/}/api/health" >/dev/null

      - name: Run Playwright QA
        run: npx playwright test --project=desktop-chromium

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
