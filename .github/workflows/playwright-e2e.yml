name: OneEngine Playwright E2E

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "server/**"
      - "tests/e2e/**"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/playwright-e2e.yml"

concurrency:
  group: oneengine-playwright-e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ONEPOS_E2E_BASE_URL: https://onesolutions-ahuja.github.io/OneEngine/
      ONEPOS_E2E_USERNAME: ${{ secrets.ONEPOS_E2E_USERNAME }}
      ONEPOS_E2E_PASSWORD: ${{ secrets.ONEPOS_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for deployed frontend
        run: |
          for i in {1..18}; do
            if curl -fsSL "https://onesolutions-ahuja.github.io/OneEngine/" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Verify E2E credentials
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$(jq -n --arg username "$ONEPOS_E2E_USERNAME" --arg password "$ONEPOS_E2E_PASSWORD" '{username:$username,password:$password,actingCompanyId:null}')"
          STATUS="$(curl -sS -o /tmp/onepos-e2e-login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            'https://onepos.onrender.com/api/auth/login')"
          if [ "$STATUS" != "200" ] || [ "$(jq -r '.success // false' /tmp/onepos-e2e-login.json)" != "true" ]; then
            MESSAGE="$(jq -r '.message // "authentication rejected"' /tmp/onepos-e2e-login.json)"
            echo "::error::E2E login failed (HTTP $STATUS): $MESSAGE"
            exit 1
          fi
          echo "E2E credential check passed."

      - name: Run Playwright QA
        run: npx playwright test --project=desktop-chromium

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
