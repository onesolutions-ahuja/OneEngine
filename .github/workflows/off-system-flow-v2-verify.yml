name: OFF System Flow V2 Verification
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/openFoodFactsCoreWorkflow.test.mjs tests/workflowBuilderRegistryVisibility.test.mjs
      - run: npm run test:unit
      - run: npm run build
