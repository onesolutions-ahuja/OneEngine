name: OneEngine Final Batch Check

on:
  push:
    branches:
      - fix/sfdc-builder-dock-login-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Full frontend build
        env:
          VITE_BASE_PATH: /OneEngine/
          VITE_API_BASE: https://oneengine.onrender.com
        run: npm run build
