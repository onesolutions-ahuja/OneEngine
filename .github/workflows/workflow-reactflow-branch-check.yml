name: Workflow ReactFlow Branch Check

on:
  push:
    branches:
      - fix/workflow-reactflow-canvas-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile for branch dependency
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact dependencies
        run: npm ci
      - name: Build frontend
        env:
          VITE_BASE_PATH: /OneEngine/
          VITE_API_BASE: https://oneengine.onrender.com
        run: npm run build
      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: workflow-reactflow-package-lock
          path: package-lock.json
