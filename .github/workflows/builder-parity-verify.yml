name: Builder Parity Verify

on:
  push:
    branches: [builder-sfdc-parity-current]
    paths:
      - ".github/workflows/builder-parity-verify.yml"
      - "src/pages/developer/Builder2Page.jsx"
      - "src/pages/developer/Builder2Page.css"
      - "src/pages/developer/Builder2GraphCanvas.jsx"
      - "src/pages/developer/Builder2AutoLayout.jsx"
      - "src/pages/developer/builder2Runtime.js"
      - "src/pages/developer/builder2Model.js"
      - "src/pages/flow/ScreenFlowRuntimePage.jsx"
      - "server/services/platformWorkflow.js"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:workflow-coverage
      - run: node --test tests/builder2Runtime.test.mjs tests/builderRuntimeRecord.test.mjs
      - run: npm run build
