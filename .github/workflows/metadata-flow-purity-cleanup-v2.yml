name: Metadata Flow Purity Cleanup V2

on:
  push:
    branches:
      - audit/metadata-flow-purity-cleanup-v2
    paths:
      - "scripts/apply-metadata-flow-purity-cleanup-v2.py"
      - ".github/workflows/metadata-flow-purity-cleanup-v2.yml"
      - "tests/appointmentWorkflow.test.mjs"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/metadata-flow-purity-cleanup-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply cleanup
        run: python3 scripts/apply-metadata-flow-purity-cleanup-v2.py
      - name: Verify cleanup
        run: |
          node --check server/services/platformWorkflow.js
          node --check server/database/init.js
          node --check scripts/run-appointment-debug.mjs
          node --check tests/e2e/appointment-workflow-debug.spec.mjs
          node --test tests/appointmentWorkflow.test.mjs
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "oneengine-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/services/platformWorkflow.js server/database/init.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove unused appointment workflow wrappers"
          git push origin HEAD:audit/metadata-flow-purity-cleanup-v2
