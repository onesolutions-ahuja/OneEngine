name: Booking Wrapper Cleanup Validation

on:
  push:
    branches:
      - audit/remove-inactive-booking-link-wrappers-20261004
    paths:
      - ".github/workflows/booking-wrapper-cleanup-validation.yml"
      - "server/services/platformWorkflow.js"
      - "server/services/oneAssistant.js"
      - "server/services/packageRegistry.js"
      - "server/database/init.js"
      - "tests/appointmentWorkflow.test.mjs"
      - "server/test/oneAssistant.test.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/remove-inactive-booking-link-wrappers-20261004
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Negative search
        run: |
          ! grep -R --line-number --exclude='metadata-flow-purity-audit-2026-10-03.md' --exclude='init.js' --exclude='appointmentWorkflow.test.mjs' 'CREATE_APPOINTMENT_BOOKING_CASE\|ISSUE_APPOINTMENT_BOOKING_LINK' server src
          ! grep -n 'name: "OneAssistant - Email Booking"' server/services/packageRegistry.js
      - name: Syntax
        run: |
          node --check server/services/platformWorkflow.js
          node --check server/services/oneAssistant.js
          node --check server/services/packageRegistry.js
          node --check server/database/init.js
          node --check server/test/oneAssistant.test.mjs
      - name: Focused tests
        run: |
          node --test tests/appointmentWorkflow.test.mjs
          node --test server/test/oneAssistant.test.mjs
      - name: Production build
        run: npm run build
