name: OFF Core Cleanup Verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test tests/openFoodFactsCoreWorkflow.test.mjs tests/workflowBuilderRegistryVisibility.test.mjs
      - run: npm run build
