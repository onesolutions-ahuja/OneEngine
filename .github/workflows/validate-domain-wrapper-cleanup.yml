name: Validate Domain Wrapper Cleanup

on:
  push:
    branches:
      - audit/domain-wrapper-usage-20261004
    paths:
      - ".github/workflows/validate-domain-wrapper-cleanup.yml"
      - "server/services/platformWorkflow.js"
      - "server/database/init.js"
      - "tests/domainWrapperCleanup.test.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/domain-wrapper-usage-20261004
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check server/services/platformWorkflow.js
          node --check server/database/init.js
      - name: Tests
        run: |
          node --test tests/domainWrapperCleanup.test.mjs
          node --test tests/appointmentWorkflow.test.mjs
      - name: Build
        run: npm run build
