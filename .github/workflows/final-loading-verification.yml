name: Final OneEngine Loading Verification

on:
  push:
    branches: ["main"]

concurrency:
  group: oneengine-final-loading-verification
  cancel-in-progress: true

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[perf-verify]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ONEPOS_E2E_BASE_URL: https://onesolutions-ahuja.github.io/OneEngine/
      ONEPOS_E2E_API_BASE_URL: https://oneengine-6gas.onrender.com/
      ONEPOS_E2E_USERNAME: ${{ vars.ONEPOS_PLAYWRIGHT_USERNAME }}
      ONEPOS_E2E_PASSWORD: ${{ vars.ONEPOS_PLAYWRIGHT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify current Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            SHA="$(curl -fsSL https://onesolutions-ahuja.github.io/OneEngine/deploy-sha.txt 2>/dev/null || true)"
            if [ "$SHA" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::GitHub Pages did not reach $GITHUB_SHA"
          exit 1
      - name: Wait for exact backend deployment readiness
        shell: bash
        run: |
          set -euo pipefail
          API="${ONEPOS_E2E_API_BASE_URL%/}"
          for attempt in {1..36}; do
            BODY="$(curl -fsSL "$API/api/health" 2>/dev/null || true)"
            STATUS="$(printf '%s' "$BODY" | jq -r '.status // empty' 2>/dev/null || true)"
            COMMIT="$(printf '%s' "$BODY" | jq -r '.diagnostics.buildCommit // empty' 2>/dev/null || true)"
            if { [ "$STATUS" = "ready" ] || [ "$STATUS" = "online" ]; } && [ "$COMMIT" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::OneEngine API did not reach ready state for commit $GITHUB_SHA"
          exit 1

      - name: Run final loading verification
        run: npx playwright test tests/e2e/final-loading-verification.spec.mjs --project=desktop-chromium --workers=1
