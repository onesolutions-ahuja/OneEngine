name: Final OneEngine Loading Verification

on:
  workflow_run:
    workflows: ["Deploy OneEngine to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: oneengine-final-loading
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ONEPOS_E2E_BASE_URL: https://onesolutions-ahuja.github.io/OneEngine/
      ONEPOS_E2E_API_BASE_URL: https://oneengine-6gas.onrender.com/
      ONEPOS_E2E_USERNAME: ${{ vars.ONEPOS_PLAYWRIGHT_USERNAME }}
      ONEPOS_E2E_PASSWORD: ${{ vars.ONEPOS_PLAYWRIGHT_PASSWORD }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify current Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            SHA="$(curl -fsSL https://onesolutions-ahuja.github.io/OneEngine/deploy-sha.txt 2>/dev/null || true)"
            if [ "$SHA" = "$DEPLOY_SHA" ]; then
              exit 0
            fi
            if [ -n "$SHA" ]; then
              RELATION="$(curl -fsSL "https://api.github.com/repos/onesolutions-ahuja/OneEngine/compare/$DEPLOY_SHA...$SHA" 2>/dev/null | jq -r '.status // empty' 2>/dev/null || true)"
              if [ "$RELATION" = "ahead" ] || [ "$RELATION" = "identical" ]; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::GitHub Pages did not reach a deployment containing $DEPLOY_SHA"
          exit 1
      - name: Wait for compatible backend deployment readiness
        shell: bash
        run: |
          set -euo pipefail
          API="${ONEPOS_E2E_API_BASE_URL%/}"
          for attempt in {1..36}; do
            BODY="$(curl -fsSL "$API/api/health" 2>/dev/null || true)"
            STATUS="$(printf '%s' "$BODY" | jq -r '.status // empty' 2>/dev/null || true)"
            COMMIT="$(printf '%s' "$BODY" | jq -r '.diagnostics.buildCommit // empty' 2>/dev/null || true)"
            if { [ "$STATUS" = "ready" ] || [ "$STATUS" = "online" ]; } && [ -n "$COMMIT" ]; then
              if [ "$COMMIT" = "$DEPLOY_SHA" ]; then
                exit 0
              fi
              # Render can skip an intermediate main commit when newer pushes
              # arrive quickly. A newer deployed descendant still contains the
              # target commit and is therefore compatible for live verification.
              RELATION="$(curl -fsSL "https://api.github.com/repos/onesolutions-ahuja/OneEngine/compare/$DEPLOY_SHA...$COMMIT" 2>/dev/null | jq -r '.status // empty' 2>/dev/null || true)"
              if [ "$RELATION" = "ahead" ] || [ "$RELATION" = "identical" ]; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::OneEngine API did not reach a ready deployment containing $DEPLOY_SHA"
          exit 1

      - name: Require authenticated QA credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ONEPOS_E2E_USERNAME:-}" || { echo "::error::ONEPOS_PLAYWRIGHT_USERNAME repository variable is required"; exit 1; }
          test -n "${ONEPOS_E2E_PASSWORD:-}" || { echo "::error::ONEPOS_PLAYWRIGHT_PASSWORD repository variable is required"; exit 1; }
      - name: Run final loading and 1.5s performance verification
        run: npx playwright test tests/e2e/final-loading-verification.spec.mjs tests/e2e/final-performance.spec.mjs --project=desktop-chromium --workers=4
