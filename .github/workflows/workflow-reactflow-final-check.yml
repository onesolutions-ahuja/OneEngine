name: Workflow ReactFlow Final Check

on:
  push:
    branches:
      - fix/workflow-reactflow-canvas-final-20261002
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for React Flow"
          git push
      - name: Install exact dependencies
        run: npm ci
      - name: Check workflow canvas modules
        run: |
          npx esbuild src/pages/settings/Platform/WorkflowReactFlowCanvas.jsx --bundle --format=esm --outfile=/tmp/workflow-canvas.js --loader:.jsx=jsx
          npx esbuild src/pages/settings/Platform/WorkflowAdmin.jsx --bundle --format=esm --outfile=/tmp/workflow-admin.js --loader:.jsx=jsx
