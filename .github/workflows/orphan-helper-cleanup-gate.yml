name: Orphaned Helper Cleanup Gate

on:
  push:
    branches:
      - audit/remove-orphaned-adjustment-classifier
    paths:
      - ".github/workflows/orphan-helper-cleanup-gate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check server/services/adjustmentReasons.js
      - run: npm run test:unit
