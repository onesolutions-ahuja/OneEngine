name: Dead Appointment Confirmation Cleanup Validation

on:
  push:
    branches:
      - audit/remove-dead-appointment-confirmation-20261004
    paths:
      - ".github/workflows/dead-appointment-confirmation-validation.yml"
      - "server/services/platformWorkflow.js"
      - "server/database/init.js"
      - "tests/appointmentWorkflow.test.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/remove-dead-appointment-confirmation-20261004
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check server/services/platformWorkflow.js
          node --check server/database/init.js
      - name: Appointment tests
        run: node --test tests/appointmentWorkflow.test.mjs
      - name: Production build
        run: npm run build
