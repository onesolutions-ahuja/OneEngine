name: Generic Appointment Slot Flow Migration

on:
  push:
    branches:
      - audit/appointment-slot-flow-generic-20261003
    paths:
      - ".github/workflows/generic-slot-flow.yml"
      - "tests/appointmentWorkflow.test.mjs"
      - "server/services/platformWorkflow.js"
      - "server/services/packageRegistry.js"
      - "server/database/init.js"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/appointment-slot-flow-generic-20261003
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate
        run: |
          node --check server/services/platformWorkflow.js
          node --check server/services/packageRegistry.js
          node --check server/database/init.js
          node --test tests/appointmentWorkflow.test.mjs
