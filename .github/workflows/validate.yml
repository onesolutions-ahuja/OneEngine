name: Validate OneEngine

on:
  push:
    branches: [main, flow-object-migration-work]
  pull_request:
  workflow_dispatch:

concurrency:
  group: oneengine-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build first so deploy-blocking syntax/audit failures are always visible,
      # even when unrelated unit tests on main are already failing.
      - run: npm run build
      # server has its own package.json but no package-lock.json, so npm ci is invalid here.
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm run test:unit
      - run: npm run audit:trusted
      - run: npm run audit:apps
      - run: npm run audit:workflow-coverage:enforce

  playwright-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-and-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop-chromium
        env:
          ONEPOS_E2E_BASE_URL: https://onesolutions-ahuja.github.io/OneEngine/
          ONEPOS_E2E_USERNAME: ${{ vars.ONEPOS_PLAYWRIGHT_USERNAME }}
          ONEPOS_E2E_PASSWORD: ${{ vars.ONEPOS_PLAYWRIGHT_PASSWORD }}
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-playwright-report
          path: |
            playwright-report/
            test-results/
            !test-results/.auth/
          retention-days: 14

  workflow-visual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-and-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start branch frontend preview
        shell: bash
        run: |
          set -euo pipefail
          VITE_BASE_PATH=/ npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/oneengine-vite.log 2>&1 &
          echo $! > /tmp/oneengine-vite.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/oneengine-vite.log || true
          exit 1
      - name: Run Workflow Builder visual gate
        run: npx playwright test tests/e2e/gptbuilder-foundation.spec.mjs --project=desktop-chromium
        env:
          ONEPOS_E2E_BASE_URL: http://127.0.0.1:4173/
          ONEPOS_E2E_USERNAME: ${{ vars.ONEPOS_PLAYWRIGHT_USERNAME }}
          ONEPOS_E2E_PASSWORD: ${{ vars.ONEPOS_PLAYWRIGHT_PASSWORD }}
          ONEPOS_API_URL: https://oneengine-6gas.onrender.com
      - name: Upload Workflow Builder visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-builder-visual-evidence
          path: |
            test-results/workflow-builder-visual/
            playwright-report/
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 14
