name: Validate OneEngine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:trusted
      - run: npm run audit:apps
      - run: npm run audit:workflow-coverage:enforce
      - run: npm run build
      # server has its own package.json but no package-lock.json, so npm ci is invalid here.
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: server
      - run: npm run build
        working-directory: server

  playwright-smoke:
    runs-on: ubuntu-latest
    needs: build-and-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop-chromium
        env:
          ONEPOS_E2E_BASE_URL: https://onesolutions-ahuja.github.io/OneEngine/
          ONEPOS_E2E_USERNAME: ${{ secrets.PLAYWRIGHT_USERNAME }}
          ONEPOS_E2E_PASSWORD: ${{ secrets.PLAYWRIGHT_PASSWORD }}
