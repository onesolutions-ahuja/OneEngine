name: Send Communication Hardening V2 Validation

on:
  push:
    branches:
      - audit/send-communication-hardening-v2-20261004
    paths:
      - ".github/workflows/send-communication-hardening-v2-validation.yml"
      - "server/services/platformWorkflow.js"
      - "server/services/systemWorkflowCatalog.js"
      - "server/services/internalAppCatalog.js"
      - "server/database/init.js"
      - "tests/sendCommunicationHardening.test.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/send-communication-hardening-v2-20261004
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check server/services/platformWorkflow.js
          node --check server/services/systemWorkflowCatalog.js
          node --check server/services/internalAppCatalog.js
          node --check server/database/init.js
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
