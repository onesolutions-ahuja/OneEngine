name: Appointment Workflow Debug

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/appointment-debug.yml"
      - "scripts/run-appointment-debug.mjs"
      - "server/services/platformWorkflow.js"
      - "server/routes/platform.js"
      - "server/services/packageRegistry.js"
      - "server/database/init.js"

concurrency:
  group: appointment-workflow-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  appointment-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ONEPOS_E2E_USERNAME: ${{ vars.ONEPOS_PLAYWRIGHT_USERNAME }}
      ONEPOS_E2E_PASSWORD: ${{ vars.ONEPOS_PLAYWRIGHT_PASSWORD }}
      ONEPOS_API_URL: https://oneengine.onrender.com
      ONEPOS_E2E_ORIGIN: https://onesolutions-ahuja.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for OneEngine API
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..90}; do
            if curl -fsS "$ONEPOS_API_URL/api/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "OneEngine API did not become ready" >&2
          exit 1
      - name: Run live appointment Workflow Debug
        run: node scripts/run-appointment-debug.mjs
