name: Supplier Till Orphan Cleanup Gate

on:
  push:
    branches:
      - audit/remove-orphaned-supplier-till-rules
    paths:
      - ".github/workflows/supplier-till-orphan-cleanup-gate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check server/services/supplierAccounts.js
      - run: npm run test:unit
      - run: npm run build
