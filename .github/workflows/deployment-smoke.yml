name: OneEngine Deployment Smoke Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: oneengine-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployments
        run: sleep 10

      - name: Test GitHub Pages shell and assets
        run: |
          set -euo pipefail
          PAGE="https://onesolutions-ahuja.github.io/OneEngine/"
          curl --retry 12 --retry-all-errors --retry-delay 10 -fsSL "$PAGE" -o /tmp/pages.html
          DEPLOYED_SHA=""
          for attempt in {1..18}; do
            DEPLOYED_SHA="$(curl -fsSL "${PAGE}deploy-sha.txt" 2>/dev/null || true)"
            if [ "$DEPLOYED_SHA" = "$GITHUB_SHA" ]; then break; fi
            sleep 10
          done
          test "$DEPLOYED_SHA" = "$GITHUB_SHA"
          grep -q '/OneEngine/assets/' /tmp/pages.html
          ASSET="$(grep -oE '/OneEngine/assets/[^"]+\.js' /tmp/pages.html | head -1)"
          test -n "$ASSET"
          curl --retry 6 --retry-all-errors --retry-delay 5 -fsSI "https://onesolutions-ahuja.github.io$ASSET" >/dev/null
          # GitHub Pages is static hosting: verify the deployed SPA shell and
          # entry asset here. In-app/deep-route navigation is covered by the
          # browser loading verification rather than expecting a static file
          # at every client-side route.

      - name: Test backend legacy browser redirect
        run: |
          set -euo pipefail
          HEADERS="$(curl --retry 6 --retry-all-errors --retry-delay 5 -fsSI "https://oneengine-6gas.onrender.com/")"
          echo "$HEADERS"
          echo "$HEADERS" | grep -qi '^location: https://onesolutions-ahuja.github.io/OneEngine'

      - name: Test backend and database health
        run: |
          set -euo pipefail
          BODY="$(curl --retry 12 --retry-all-errors --retry-delay 10 -fsSL "https://oneengine-6gas.onrender.com/api/health")"
          echo "$BODY"
          echo "$BODY" | grep -q '"success":true'
          echo "$BODY" | grep -Eq '"status":"(online|ready)"'
          echo "$BODY" | grep -q '"database":"connected"'

      - name: Test API CORS from GitHub Pages
        run: |
          set -euo pipefail
          HEADERS="$(curl --retry 6 --retry-all-errors --retry-delay 5 -fsSI \
            -H 'Origin: https://onesolutions-ahuja.github.io' \
            "https://oneengine-6gas.onrender.com/api/health")"
          echo "$HEADERS"
          echo "$HEADERS" | grep -qi 'access-control-allow-origin:'


      - name: Checkout for final performance verification
        if: contains(github.event.head_commit.message, '[perf-verify]')
        uses: actions/checkout@v4

      - name: Set up Node for final performance verification
        if: contains(github.event.head_commit.message, '[perf-verify]')
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install final performance verifier
        if: contains(github.event.head_commit.message, '[perf-verify]')
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Final live login and page-loading verification
        if: contains(github.event.head_commit.message, '[perf-verify]')
        env:
          ONEPOS_E2E_BASE_URL: https://onesolutions-ahuja.github.io/OneEngine/
          ONEPOS_E2E_API_BASE_URL: https://oneengine-6gas.onrender.com/
          ONEPOS_E2E_USERNAME: ${{ vars.ONEPOS_PLAYWRIGHT_USERNAME }}
          ONEPOS_E2E_PASSWORD: ${{ vars.ONEPOS_PLAYWRIGHT_PASSWORD }}
        run: npx playwright test tests/e2e/final-performance.spec.mjs --project=desktop-chromium --workers=1
