name: Fix tenant Superadmin RBAC bootstrap
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-tenant-superadmin-rbac.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch bootstrap model
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/database/init.js')
          s = p.read_text()
          start = s.index('    {\n      key: "0019_dual_superadmin_seed",')
          end = s.index('  ]);', start)
          replacement = '''    {
      key: "0019_dual_superadmin_seed",
      version: "19",
      name: "Legacy dual Superadmin seed (superseded by tenant RBAC model)",
      up: async () => {},
    },
    {
      key: "0020_engine_manager_all_permissions",
      version: "20",
      name: "Legacy global Engine Manager grant (superseded by tenant RBAC model)",
      up: async () => {},
    },
'''
          s = s[:start] + replacement + s[end:]

          start = s.index('export async function bootstrapInitialSuperadmin(')
          end = s.index('\nasync function initializeLegacyDatabase(', start)
          bootstrap = '''export async function bootstrapInitialSuperadmin(pool, env = process.env) {
  const configuredCompanyId = String(env.BOOTSTRAP_SUPERADMIN_COMPANY_ID || "").trim();
  const companyResult = configuredCompanyId
    ? await pool.query("SELECT id,name,user_email_domain FROM companies WHERE id=$1 AND active=true LIMIT 1", [configuredCompanyId])
    : await pool.query("SELECT id,name,user_email_domain FROM companies WHERE LOWER(name)=LOWER('onePOS Demo') AND active=true ORDER BY created_at,id LIMIT 1");
  const company = companyResult.rows[0] || null;
  if (!company) {
    console.warn("onePOS: tenant Superadmin bootstrap skipped; no configured active company was found");
    return { tenantSuperadminReady: false, reason: "company_not_configured" };
  }

  let tenantRole = await pool.query(
    "SELECT id FROM roles WHERE company_id=$1 AND api_key='platform_superadmin' ORDER BY created_at,id LIMIT 1",
    [company.id]
  );
  let tenantRoleId = tenantRole.rows[0]?.id || null;
  if (!tenantRoleId) {
    const insertedRole = await pool.query(
      `INSERT INTO roles (company_id,name,description,is_system_role,api_key)
       VALUES ($1,'Superadmin','Tenant Superadmin. Full access through ordinary RBAC.',TRUE,'platform_superadmin')
       RETURNING id`,
      [company.id]
    );
    tenantRoleId = insertedRole.rows[0].id;
  } else {
    await pool.query(
      `UPDATE roles SET name='Superadmin',description='Tenant Superadmin. Full access through ordinary RBAC.',is_system_role=TRUE WHERE id=$1`,
      [tenantRoleId]
    );
  }

  // Superadmin is not an identity bypass. Its company-bound role receives the
  // complete permission catalogue, including oneengine.manage.
  await pool.query(
    `INSERT INTO role_permissions (role_id,permission_id)
     SELECT $1,p.id FROM permissions p
     ON CONFLICT (role_id,permission_id) DO NOTHING`,
    [tenantRoleId]
  );

  const configuredTenantEmail = String(env.BOOTSTRAP_TENANT_SUPERADMIN_EMAIL || "").trim().toLowerCase();
  const domain = String(company.user_email_domain || "").trim().toLowerCase().replace(/^@/, "");
  const tenantEmail = configuredTenantEmail || "superadmin@onepos.com";
  const tenantPassword = String(env.BOOTSTRAP_TENANT_SUPERADMIN_PASSWORD || env.BOOTSTRAP_SUPERADMIN_PASSWORD || "");
  const tenantName = String(env.BOOTSTRAP_TENANT_SUPERADMIN_NAME || env.BOOTSTRAP_SUPERADMIN_NAME || `${company.name} Superadmin`).trim();

  // Remove only the obsolete company-less identity. Tenant-local identities are preserved.
  await pool.query(
    `DELETE FROM users WHERE company_id IS NULL
      AND (LOWER(COALESCE(username,''))='superadmin@onepos.com' OR LOWER(COALESCE(email,''))='superadmin@onepos.com')`
  );

  let tenantUser = await pool.query(
    `SELECT id,password_hash FROM users
      WHERE company_id=$1
        AND (LOWER(username)=LOWER($2) OR LOWER(email)=LOWER($2))
      ORDER BY created_at,id LIMIT 1`,
    [company.id, tenantEmail]
  );
  if (!tenantUser.rows[0]) {
    tenantUser = await pool.query(
      `SELECT u.id,u.password_hash FROM users u
        WHERE u.company_id=$1 AND u.active=true
          AND EXISTS (SELECT 1 FROM user_roles ur JOIN roles r ON r.id=ur.role_id WHERE ur.user_id=u.id AND r.company_id=$1 AND r.api_key='platform_superadmin')
        ORDER BY u.created_at,u.id LIMIT 1`,
      [company.id]
    );
  }

  if (tenantUser.rows[0]) {
    const passwordHash = tenantPassword ? await bcrypt.hash(tenantPassword, 12) : tenantUser.rows[0].password_hash;
    await pool.query(
      `UPDATE users SET company_id=$1,role_id=$2,username=$3,email=$3,full_name=$4,password_hash=$5,active=TRUE,is_platform_developer=FALSE,updated_at=NOW() WHERE id=$6`,
      [company.id, tenantRoleId, tenantEmail, tenantName, passwordHash, tenantUser.rows[0].id]
    );
  } else if (tenantPassword) {
    const passwordHash = await bcrypt.hash(tenantPassword, 12);
    tenantUser = await pool.query(
      `INSERT INTO users (company_id,role_id,username,email,password_hash,full_name,is_platform_developer,active,must_change_password)
       VALUES ($1,$2,$3,$3,$4,$5,FALSE,TRUE,TRUE) RETURNING id,password_hash`,
      [company.id, tenantRoleId, tenantEmail, passwordHash, tenantName]
    );
  } else {
    console.warn("onePOS: tenant Superadmin user not created because no bootstrap password is configured");
  }

  if (tenantUser.rows?.[0]) {
    await pool.query(
      `INSERT INTO user_roles (user_id,role_id) VALUES ($1,$2) ON CONFLICT DO NOTHING`,
      [tenantUser.rows[0].id, tenantRoleId]
    );
  }

  return {
    tenantSuperadminReady: Boolean(tenantUser.rows?.[0]),
    tenantSuperadminEmail: tenantEmail,
    companyId: company.id,
    tenantRoleId,
  };
}
'''
          s = s[:start] + bootstrap + s[end:]

          # Legacy compatibility role must not be recreated by startup bootstrap.
          marker = '    /* Global Platform Developer role: metadata administration is deliberately'
          if marker in s:
            a = s.index(marker)
            b = s.index('    await pool.query(`\n    ALTER TABLE companies', a)
            s = s[:a] + s[b:]

          p.write_text(s)
      - name: Validate syntax and policy
        run: |
          node --check server/database/init.js
          ! grep -q 'apiKey: "engine_manager"' server/database/init.js
          ! grep -q 'SET company_id=NULL' server/database/init.js
          grep -q "SELECT \$1,p.id FROM permissions p" server/database/init.js
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name 'OneEngine Automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/fix-tenant-superadmin-rbac.yml
          git add server/database/init.js
          git commit -m 'Use company-bound Superadmin with full RBAC authority'
          git push
