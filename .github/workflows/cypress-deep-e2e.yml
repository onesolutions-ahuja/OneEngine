name: OneEngine Cypress Deep E2E
# Cypress Cloud recording is enabled when CYPRESS_RECORD_KEY is configured.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy OneEngine to GitHub Pages"]
    types: [completed]

concurrency:
  group: oneengine-cypress-deep-e2e
  cancel-in-progress: true

jobs:
  deep-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ONEPOS_E2E_BASE_URL: https://onesolutions-ahuja.github.io/OneEngine/
      ONEPOS_E2E_API_BASE_URL: https://oneengine.onrender.com
      ONEPOS_E2E_USERNAME: ${{ vars.ONEPOS_PLAYWRIGHT_USERNAME }}
      ONEPOS_E2E_PASSWORD: ${{ vars.ONEPOS_PLAYWRIGHT_PASSWORD }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Wait for deployed frontend, entry asset, and API
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          ORIGIN="https://onesolutions-ahuja.github.io"
          for i in {1..36}; do
            API=0
            ENTRY=0
            HTML="$(curl -fsSL -H 'Cache-Control: no-cache' "${ONEPOS_E2E_BASE_URL}?e2e=${EXPECTED_SHA}-${i}" || true)"
            ASSET="$(printf '%s' "$HTML" | grep -oE 'src="[^"]+\.js"' | head -n1 | sed -E 's/^src="(.*)"$/\1/' || true)"
            if [ -n "$ASSET" ]; then
              if [[ "$ASSET" == http* ]]; then
                ASSET_URL="$ASSET"
              elif [[ "$ASSET" == /* ]]; then
                ASSET_URL="${ORIGIN}${ASSET}"
              else
                ASSET_URL="${ONEPOS_E2E_BASE_URL}${ASSET}"
              fi
              curl -fsSL -H 'Cache-Control: no-cache' "$ASSET_URL" >/dev/null && ENTRY=1 || true
            fi
            curl -fsSL "$ONEPOS_E2E_API_BASE_URL/api/health" >/dev/null && API=1 || true
            if [ "$ENTRY" = "1" ] && [ "$API" = "1" ]; then
              echo "Testing deployed Pages for commit $EXPECTED_SHA with entry asset $ASSET_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Frontend entry asset or API did not become ready in time."
          exit 1

      - name: Verify credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ONEPOS_E2E_USERNAME" || { echo "::error::ONEPOS_PLAYWRIGHT_USERNAME repository variable is missing."; exit 1; }
          test -n "$ONEPOS_E2E_PASSWORD" || { echo "::error::ONEPOS_PLAYWRIGHT_PASSWORD repository variable is missing."; exit 1; }

      - name: Install Cypress runtime
        run: npx --yes cypress@15.5.0 verify

      - name: Run deep Cypress suite
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CYPRESS_RECORD_KEY:-}" ]; then
            npx --yes cypress@15.5.0 run --browser chrome --record --key "$CYPRESS_RECORD_KEY"
          else
            echo "CYPRESS_RECORD_KEY is not configured; running locally in GitHub Actions without Cypress Cloud recording."
            npx --yes cypress@15.5.0 run --browser chrome
          fi

      - name: Upload Cypress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-deep-e2e-evidence
          path: |
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: ignore
          retention-days: 14
