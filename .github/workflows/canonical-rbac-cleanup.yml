name: Canonical RBAC cleanup

on:
  push:
    paths:
      - '.github/workflows/canonical-rbac-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cleanup
        run: python scripts/canonical-rbac-cleanup.py
      - name: Syntax check
        run: |
          node --check server/database/init.js
          node --check server/database/rbacBootstrap.js
          node --check server/server.js
      - name: Commit cleanup
        run: |
          git config user.name "OneEngine RBAC Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add server/database/init.js server/database/rbacBootstrap.js server/server.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(auth): canonical company-bound RBAC across startup"
          git push
