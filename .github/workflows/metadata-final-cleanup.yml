name: Metadata Final Cleanup Gate

on:
  push:
    branches:
      - metadata-final-cleanup
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Metadata architecture gate
        run: npm run audit:metadata-architecture
      - name: Frontend build
        run: npm run build
      - name: Frontend unit tests
        run: npm run test:unit
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Server build gate
        working-directory: server
        run: npm run build
