name: Auto Invoice Dispatch Cleanup Gate

on:
  push:
    branches:
      - audit/remove-unused-auto-invoice-dispatch
    paths:
      - ".github/workflows/auto-invoice-dispatch-cleanup-gate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          node --check server/services/invoiceDelivery.js
          node --check server/services/whatsappDelivery.js
      - run: npm run test:unit
      - run: npm run build
